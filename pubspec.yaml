<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d14">
<title>XXC STORE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--bg:#090d14;--panel:#121a26;--line:#273446;--muted:#9aa7b8;--lime:#caff58;--white:#f5f7fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#173344 0,transparent 38%),var(--bg);color:var(--white);font-family:Cairo,Arial,sans-serif}
header{height:76px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100% - 1120px)/2))}
.logo{direction:ltr;font-weight:900;font-size:20px;letter-spacing:1px}.logo b{color:var(--lime)}.mark{display:inline-grid;place-items:center;background:var(--lime);color:#10160b;border-radius:10px;width:35px;height:35px;margin-left:9px}
button,a{font:inherit}.admin,.btn{border:1px solid var(--line);background:#182333;color:white;padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none;font-size:12px}.admin:hover{border-color:var(--lime)}
main{max-width:1120px;margin:auto;padding:0 22px}.hero{padding:75px 0 65px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:30px}
.kicker{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(43px,7vw,72px);line-height:1.2;margin:15px 0;font-weight:900}.hero h1 span{color:var(--lime)}.hero p{color:var(--muted);font-size:14px;line-height:2;max-width:520px}.hero .btn{display:inline-block;background:var(--lime);color:#11180a;border:0;font-weight:900;padding:12px 22px;margin-top:13px}
.art{height:260px;display:grid;place-items:center;position:relative}.cube{width:170px;height:170px;border-radius:38px;background:linear-gradient(140deg,#d6ff82,#8dbb32);display:grid;place-items:center;color:#111;font-size:94px;font-weight:900;box-shadow:0 25px 90px #b8ed4a35;transform:rotate(9deg)}.ring{position:absolute;width:260px;height:180px;border:1px solid #caff5830;border-radius:50%;transform:rotate(-28deg)}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.section-title h2{font-size:27px;margin:3px 0}.section-title h2 span{color:var(--lime)}.search{background:#121a26;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:white;width:min(270px,100%);outline:none;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding-bottom:70px}.card,.empty{background:linear-gradient(145deg,#151f2d,#101722);border:1px solid var(--line);border-radius:15px;padding:18px}.card-top{display:flex;align-items:center;gap:12px}.appicon{width:55px;height:55px;border-radius:14px;background:#263447;display:grid;place-items:center;color:var(--lime);font-size:25px;font-weight:900;object-fit:cover}.card h3{font-size:15px;margin:0}.sub{font-size:10px;color:var(--lime)}.desc{font-size:11px;line-height:1.9;color:var(--muted);min-height:43px;margin:14px 0}.meta{display:flex;justify-content:space-between;color:#8794a5;font-size:10px;border-top:1px solid var(--line);padding-top:11px}.download{display:block;text-align:center;margin-top:13px;background:#caff5815;border:1px solid #caff5840;color:var(--lime);padding:10px;border-radius:8px;text-decoration:none;font-weight:800;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:45px 15px;border-style:dashed}.empty strong{color:var(--lime);font-size:25px}.empty p{color:var(--muted);font-size:12px}
footer{border-top:1px solid #ffffff12;padding:23px;text-align:center;color:#8290a2;font-size:10px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#111a26;border:1px solid #35465b;border-radius:16px;padding:25px;width:min(470px,100%);max-height:90vh;overflow:auto;position:relative}.close{position:absolute;left:16px;top:12px;background:none;border:0;color:white;font-size:25px;cursor:pointer}.box h2{margin:0 0 8px}.box p{font-size:11px;color:var(--muted);line-height:1.8}.box label{display:block;font-size:11px;margin:12px 0;color:#c7d0dc}.box input,.box textarea{display:block;width:100%;margin-top:6px;background:#080e16;border:1px solid #2c3b4d;border-radius:8px;padding:11px;color:white;font:12px Cairo}.box input[type=file]{font-size:10px}.box .btn{background:var(--lime);color:#10160a;border:0;width:100%;font-weight:900;margin-top:10px}.warning{font-size:10px!important;background:#caff5810;padding:10px;border-radius:8px}
.status{font-size:10px;padding:6px 10px;border-radius:6px;display:inline-block;margin-top:8px}
.status.online{background:#caff5820;color:var(--lime)}
.status.local{background:#ff9c5820;color:#ff9c58}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:40px 0 45px;gap:0}.art{grid-row:1;height:200px}.cube{width:125px;height:125px;font-size:70px}.ring{width:210px;height:145px}.hero-copy{text-align:center}.hero p{margin:auto}.grid{grid-template-columns:1fr}.section-title{align-items:start;flex-direction:column}.search{width:100%}header{padding:0 16px}}
</style>
</head>
<body>
<header><div class="logo"><span class="mark">X</span> XXC <b>STORE</b></div><button class="admin" id="openAdmin">لوحة الإدارة ↗</button></header>
<main>
<section class="hero"><div class="hero-copy"><div class="kicker">THE OFFICIAL XXC APP HUB</div><h1>تطبيقاتك،<br><span>بمكان واحد.</span></h1><p>اكتشف تطبيقات XXC وحمّل إصدارات Android بسهولة من واجهة واحدة.</p><a class="btn" href="#apps">استكشف التطبيقات ←</a><div id="status" class="status local">جاري التحقق...</div></div><div class="art"><div class="ring"></div><div class="cube">X</div></div></section>
<section id="apps"><div class="section-title"><div><div class="kicker">DISCOVER SOMETHING NEW</div><h2>مكتبة <span>التطبيقات</span></h2></div><input id="search" class="search" placeholder="ابحث عن تطبيق..."></div><div class="grid" id="grid"></div></section>
</main><footer>© <span id="year"></span> XXC STORE · منصة تطبيقات مستقلة</footer>
<div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><div class="kicker">ADMIN PANEL</div><h2>إضافة تطبيق</h2><p>أضف بيانات التطبيق واختر ملف APK من جهازك.</p>
<form id="form"><label>اسم التطبيق<input id="name" required maxlength="70" placeholder="اسم التطبيق"></label><label>وصف التطبيق<textarea id="desc" rows="3" required maxlength="400" placeholder="وصف مختصر"></textarea></label><label>الإصدار<input id="version" required value="1.0.0"></label><label>ملف APK<input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" required></label><label>أيقونة اختيارية<input id="icon" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn" type="submit" id="submitBtn">إضافة التطبيق</button></form>
<p class="warning" id="warning">اضغط لإضافة التطبيق. سيتم رفعه للمخزن السحابي إذا كانت الإعدادات مفعّلة، أو حفظه محلياً إذا لم تكن.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   ⚙️ إعدادات Supabase — غيّر القيمتين فقط
   ============================================================ */
const SUPABASE_URL = '';  // ← حط Project URL هنا
const SUPABASE_KEY = '';  // ← حط anon public key هنا
const BUCKET = 'apk';
/* ============================================================ */

const DB='xxc-store-local-v1';
let apps=[];
let cloudEnabled=false;
let supabase=null;
const $=id=>document.getElementById(id);

// تهيئة Supabase
function initSupabase(){
  if(!SUPABASE_URL || !SUPABASE_KEY){
    $('status').className='status local';
    $('status').textContent='💾 وضع محلي — التطبيقات لا تظهر للزوار';
    return false;
  }
  try{
    supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    $('status').className='status online';
    $('status').textContent='☁️ متصل سحابياً — الزوار يشوفون التطبيقات';
    return true;
  }catch(e){
    $('status').className='status local';
    $('status').textContent='⚠️ فشل الاتصال — وضع محلي';
    return false;
  }
}

// ===== IndexedDB (محلي) =====
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('apps',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function allLocal(){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction('apps').objectStore('apps').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveLocal(a){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction('apps','readwrite');t.objectStore('apps').put(a);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

// ===== Supabase (سحابي) =====
async function allCloud(){
  const {data,error}=await supabase.from('apps').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  return data.map(a=>({
    id:a.id, name:a.name, desc:a.description, version:a.version,
    blob:{size:a.file_size}, fileName:a.file_name, url:a.file_url,
    icon:a.icon_url, cloud:true
  }));
}

async function uploadFile(file,path){
  const {error}=await supabase.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});
  if(error) throw error;
  const {data}=supabase.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function saveCloud(app,apkFile,iconFile){
  const id=crypto.randomUUID();
  const apkPath=`${id}/${apkFile.name}`;
  const apkUrl=await uploadFile(apkFile,apkPath);
  let iconUrl=null;
  if(iconFile){
    const ext=iconFile.name.split('.').pop();
    const iconPath=`${id}/icon.${ext}`;
    iconUrl=await uploadFile(iconFile,iconPath);
  }
  const {error}=await supabase.from('apps').insert({
    name:app.name, description:app.desc, version:app.version,
    file_name:apkFile.name, file_url:apkUrl, file_size:apkFile.size, icon_url:iconUrl
  });
  if(error) throw error;
}

// ===== العرض =====
function render(){
  const q=$('search').value.toLowerCase();
  const list=apps.filter(a=>(a.name+' '+a.desc).toLowerCase().includes(q));
  $('grid').innerHTML=list.length?list.map(a=>{
    const href=a.cloud?a.url:URL.createObjectURL(a.blob);
    const icon=a.icon?`<img class="appicon" src="${a.icon}">`:`<div class="appicon">${escapeHTML(a.name.slice(0,1))}</div>`;
    const size=(a.blob.size/1048576).toFixed(1);
    return `<article class="card"><div class="card-top">${icon}<div><h3>${escapeHTML(a.name)}</h3><div class="sub">ANDROID APP ${a.cloud?'☁️':''}</div></div></div><p class="desc">${escapeHTML(a.desc)}</p><div class="meta"><span>الإصدار ${escapeHTML(a.version)}</span><span>${size} MB</span></div><a class="download" href="${href}" download="${escapeHTML(a.fileName)}">↓ تحميل APK</a></article>`;
  }).join(''):`<div class="empty"><strong>✦</strong><h3>${apps.length?'لا توجد نتائج':'المتجر بانتظار تطبيقاتك'}</h3><p>${apps.length?'جرّب كلمة بحث أخرى.':'افتح لوحة الإدارة وأضف أول تطبيق إلى مكتبتك.'}</p></div>`;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ===== الأحداث =====
$('openAdmin').onclick=()=>$('modal').classList.add('show');
$('close').onclick=()=>$('modal').classList.remove('show');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
$('search').oninput=render;

$('form').onsubmit=async e=>{
  e.preventDefault();
  const file=$('apk').files[0];
  if(!file||!file.name.toLowerCase().endsWith('.apk')){alert('اختر ملف APK صحيحاً');return}
  if(file.size>200*1024*1024){alert('حجم الملف أكبر من 200MB');return}

  const appData={
    name:$('name').value.trim(),
    desc:$('desc').value.trim(),
    version:$('version').value.trim()
  };
  const iconFile=$('icon').files[0]||null;
  const btn=$('submitBtn');
  btn.disabled=true;

  try{
    if(cloudEnabled){
      btn.textContent='جاري الرفع للسحابة...';
      await saveCloud(appData,file,iconFile);
      apps=await allCloud();
      alert('✅ تم رفع التطبيق! كل الزوار سيشوفونه الآن.');
    }else{
      btn.textContent='جاري الحفظ محلياً...';
      let icon=null;
      if(iconFile) icon=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(iconFile)});
      await saveLocal({id:crypto.randomUUID(),...appData,blob:file,fileName:file.name,icon});
      apps=await allLocal();
      alert('✅ تم الحفظ محلياً. (لن يراه الآخرون — فعّل Supabase للمشاركة)');
    }
    render();
    $('form').reset();
    $('modal').classList.remove('show');
  }catch(err){
    console.error(err);
    alert('❌ خطأ: '+(err.message||err));
  }finally{
    btn.disabled=false;
    btn.textContent='إضافة التطبيق';
  }
};

// ===== بدء التشغيل =====
(async function(){
  $('year').textContent=new Date().getFullYear();
  cloudEnabled=initSupabase();
  try{
    if(cloudEnabled){
      apps=await allCloud();
    }else{
      apps=await allLocal();
    }
    render();
  }catch(err){
    console.error(err);
    $('grid').innerHTML='<div class="empty">تعذر تحميل التطبيقات. تحقق من الإعدادات.</div>';
  }
})();
</script>
</body></html>